<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>画结构式</title>
<link rel="stylesheet" href="/vendor/jsme/jsa.css" />
<style>
  html, body { margin: 0; height: 100%; background: #faf9f6; overflow: hidden; }
  #box { position: absolute; inset: 0; }
  /* JSME 自带的边框在纸色底上显得脏，去掉，只留它自己的画布 */
  #box .jsme-applet { border: none !important; }
</style>
</head>
<body>
<div id="box"></div>
<script src="/vendor/jsme/jsme.nocache.js"></script>
<script>
  /* 外面（Vue 里的弹窗）通过 iframe.contentWindow.sketcherApi 调用这几个方法 */
  window.__jsmeReady = false;

  /* JSME 只认像素尺寸（'100%' 会让它只画出工具条那一溜），所以按窗口实际大小给，并在 resize 时同步 */
  function px(n, min) {
    return Math.max(min, Math.round(n)) + 'px';
  }

  function jsmeOnLoad() {
    window.__app = new JSApplet.JSME('box', px(window.innerWidth, 320), px(window.innerHeight, 260), {
      options: 'zoom,star,atommove,nodrag',
    });
    window.__jsmeReady = true;
  }

  window.addEventListener('resize', function () {
    if (!window.__app) return;
    try {
      window.__app.setSize(px(window.innerWidth, 320), px(window.innerHeight, 260));
    } catch (e) {}
  });

  window.sketcherApi = {
    ready: () => window.__jsmeReady,
    smiles: () => {
      try { return window.__app ? window.__app.smiles() : ''; } catch (e) { return ''; }
    },
    mol: () => {
      try { return window.__app ? window.__app.molFile() : ''; } catch (e) { return ''; }
    },
    /* SMILES / MOL / InChI 都能吃进来（ChemDraw 粘的那种 SMILES 也走这条） */
    set: (text) => {
      try {
        if (!window.__app || !text) return;
        window.__app.readGenericMolecularInput(text);
      } catch (e) { /* 读不出来就当空白 */ }
    },
    clear: () => {
      try { window.__app && window.__app.clear(); } catch (e) {}
    },
  };
</script>
</body>
</html>
